# fly.toml — adjust `app` to whatever name you claim with `fly apps create`.
app = "tee-time-watcher"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/app/data"
  PORT     = "3030"

[mounts]
  source      = "tee_data"
  destination = "/app/data"

[http_service]
  internal_port       = 3030
  force_https         = true
  # Long-running watchers have no HTTP traffic of their own between "start"
  # and "match" — an idled/stopped machine silently kills them. Keep at
  # least one machine running at all times.
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period  = "10s"
    interval      = "30s"
    method        = "GET"
    path          = "/healthz"
    timeout       = "5s"
